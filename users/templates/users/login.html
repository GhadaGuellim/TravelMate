<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#1c2530; --soft:#727d87; --line:#ebe6dc;
  --ocean:#2f8fc4; --turq:#20a793; --coral:#ec7156; --sand:#d9a86c; --green:#5a9a5f;
  --danger:#d9534f;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.hidden{display:none !important;}
.g1{background:linear-gradient(135deg,var(--ocean),var(--turq));}
.g2{background:linear-gradient(135deg,var(--coral),var(--sand));}
.g3{background:linear-gradient(135deg,#84b6c9,#3f7a8c);}
.g4{background:linear-gradient(135deg,var(--sand),#8a5a3a);}
.g5{background:linear-gradient(135deg,var(--green),#8ec98a);}

/* ---------- Connexion ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:linear-gradient(135deg,var(--ocean),var(--turq));}
.auth-card{background:#fff;width:100%;max-width:400px;padding:30px;border-radius:20px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.15rem;}
.logo .mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.85rem;}
.auth-card p.sub{margin:6px 0 18px;color:var(--soft);font-size:.86rem;}
.tabs{display:flex;margin-bottom:14px;border-bottom:2px solid var(--line);}
.tabs button{flex:1;padding:10px;border:none;background:none;cursor:pointer;font:inherit;font-weight:600;font-size:.9rem;
  color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-2px;}
.tabs button.active{color:var(--turq);border-bottom-color:var(--turq);}
label{display:block;margin:12px 0 4px;font-size:.78rem;font-weight:600;color:var(--soft);}
input,textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink);}
textarea{resize:vertical;min-height:70px;}
input:focus,textarea:focus{outline:none;border-color:var(--turq);background:#fff;}
.btn{width:100%;margin-top:16px;padding:11px;border:none;border-radius:999px;background:var(--turq);color:#fff;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;}
.btn:hover{filter:brightness(.95);}
.btn.dark{background:var(--ink);}
.btn.ghost{background:#fff;color:var(--turq);border:1px solid var(--line);}

/* ---------- Application ---------- */
header.top{position:sticky;top:12px;z-index:20;margin:12px 20px 0;background:#fff;border:1px solid var(--line);border-radius:999px;
  display:flex;align-items:center;gap:14px;padding:9px 18px;box-shadow:0 12px 30px -18px rgba(28,37,48,.18);}
header.top .spacer{flex:1;}
.chip{font-size:.8rem;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px;}
.link-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--ink);}
.link-btn:hover{background:var(--bg);}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:20px;max-width:1220px;margin:18px auto 60px;padding:0 20px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
.ava{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;}
.profile-mini{display:flex;flex-direction:column;align-items:center;text-align:center;}
.profile-mini .ava{width:60px;height:60px;margin-bottom:8px;font-size:1.3rem;}
.profile-mini b{font-size:.95rem;}
.profile-mini span.mail{color:var(--soft);font-size:.74rem;word-break:break-all;}
nav.side{margin-top:14px;}
nav.side button{display:flex;gap:10px;width:100%;padding:9px 8px;border:none;background:none;border-radius:10px;color:var(--soft);
  font:inherit;font-size:.87rem;font-weight:600;cursor:pointer;text-align:left;}
nav.side button.active{background:#eaf6f4;color:var(--turq);}
nav.side button.soon{opacity:.45;cursor:default;}
.world-title{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:14px 8px 6px;}
.world-stats div{font-size:.82rem;padding:5px 8px;}

.mtabs{display:none;gap:8px;margin-bottom:14px;}
.mtabs button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:999px;font:inherit;font-weight:700;font-size:.82rem;color:var(--soft);cursor:pointer;}
.mtabs button.active{background:#eaf6f4;color:var(--turq);border-color:#cdebe6;}

.composer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:18px;}
.composer .row1{display:flex;gap:12px;align-items:flex-start;}
.composer .row1 .ava{width:38px;height:38px;font-size:.9rem;margin-top:2px;}
.composer .row2{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.composer .row2 input{flex:1;min-width:160px;border-radius:999px;}
.postbtn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:9px 22px;font:inherit;font-weight:700;font-size:.82rem;cursor:pointer;}

.section-title{font-size:1rem;font-weight:800;margin:0 0 12px;}
.post{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:18px;overflow:hidden;}
.post-head{display:flex;align-items:center;gap:10px;padding:14px 16px;}
.post-head .ava{width:38px;height:38px;font-size:.9rem;}
.post-head .who b{font-size:.92rem;}
.post-head .who div{color:var(--soft);font-size:.76rem;}
.post-body{padding:0 16px 8px;}
.post-body p{margin:0 0 8px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.action-row{display:flex;gap:16px;padding:6px 16px 14px;font-weight:700;font-size:.82rem;color:var(--soft);flex-wrap:wrap;}
.action-row span{opacity:.45;cursor:default;}
.empty{color:var(--soft);font-size:.9rem;padding:18px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:16px;}

.trip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff;}
.trip b{display:block;font-size:.92rem;}
.trip small{color:var(--soft);font-size:.78rem;}
.trip .del{border:none;background:#fdecea;color:var(--danger);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:.78rem;cursor:pointer;}
.row{display:flex;gap:10px;}
.row>div{flex:1;}

.rs-title{font-size:.95rem;font-weight:800;margin-bottom:10px;}
.adv-card{border-radius:14px;overflow:hidden;position:relative;height:170px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;margin-bottom:10px;}
.adv-card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,20,24,.75),transparent 60%);}
.adv-card *{position:relative;z-index:1;}
.adv-card .eb{font-size:.68rem;letter-spacing:.05em;opacity:.9;text-transform:uppercase;}
.adv-card h3{margin:6px 0 2px;font-size:1.2rem;}
.adv-card .rt{font-size:.8rem;opacity:.92;}
.muted{color:var(--soft);font-size:.84rem;line-height:1.5;margin:0 0 10px;}
.soon-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:.84rem;}
.soon-row:first-of-type{border-top:none;}
.soon-row small{color:var(--soft);}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  background:var(--danger);color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;max-width:90vw;display:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);}
.toast.show{display:block;}
.toast.ok{background:var(--turq);}

.p-head{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.p-head .ava{width:64px;height:64px;font-size:1.4rem;background-size:cover;background-position:center;}
.p-head b{font-size:1.05rem;}
.p-bio{margin:0 0 12px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.p-group{margin-top:12px;}
.p-group small{display:block;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;font-weight:700;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{background:#eaf6f4;color:var(--turq);border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:700;}
.tag.none{background:var(--bg);color:var(--soft);font-weight:600;}

@media (max-width:1080px){
  .layout{grid-template-columns:1fr;}
  .layout>.lsidebar,.layout>.rsidebar{display:none;}
  .mtabs{display:flex;}
}
</style>
</head>
<body>

<!-- ========== Connexion / inscription ========== -->
<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><span class="mk g1">📍</span>TravelMate</div>
    <p class="sub">Page de test de l'API</p>
    <div class="tabs">
      <button id="tab-login" class="active" type="button">Connexion</button>
      <button id="tab-register" type="button">Inscription</button>
    </div>

    <div id="form-login">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" value="test@test.com">
      <label for="login-password">Mot de passe</label>
      <input id="login-password" type="password">
      <button class="btn" id="btn-login" type="button">Se connecter</button>
    </div>

    <div id="form-register" class="hidden">
      <label for="reg-name">Nom complet</label>
      <input id="reg-name" type="text">
      <label for="reg-email">Email</label>
      <input id="reg-email" type="email">
      <label for="reg-password">Mot de passe (8 caractères minimum)</label>
      <input id="reg-password" type="password">
      <button class="btn" id="btn-register" type="button">Créer mon compte</button>
    </div>
  </div>
</div>

<!-- ========== Application ========== -->
<div id="app" class="hidden">
  <header class="top">
    <div class="logo"><span class="mk g1">📍</span>TravelMate</div>
    <div class="spacer"></div>
    <span class="chip" id="chip"></span>
    <button class="link-btn" id="btn-logout" type="button">Se déconnecter</button>
  </header>

  <div class="layout">
    <aside class="lsidebar">
      <div class="panel">
        <div class="profile-mini">
          <span class="ava g2" id="side-ava"></span>
          <b id="side-name"></b>
          <span class="mail" id="side-mail"></span>
        </div>
        <nav class="side">
          <button type="button" data-sec="feed" class="active">🏠 Accueil</button>
          <button type="button" data-sec="trips">✈️ Mes voyages</button>
          <button type="button" data-sec="profile">👤 Mon profil</button>
          <button type="button" class="soon" title="Bientôt disponible">🧭 Explorer</button>
          <button type="button" class="soon" title="Bientôt disponible">👥 Travel Mates</button>
          <button type="button" class="soon" title="Bientôt disponible">🌍 Communautés</button>
          <button type="button" class="soon" title="Bientôt disponible">✉️ Messages</button>
          <button type="button" class="soon" title="Bientôt disponible">📌 Enregistrés</button>
        </nav>
        <div class="world-title">Ton monde</div>
        <div class="world-stats">
          <div id="stat-trips">0 voyage</div>
          <div id="stat-upcoming">0 voyage à venir</div>
        </div>
      </div>
    </aside>

    <main>
      <div class="mtabs">
        <button type="button" data-sec="feed" class="active">Accueil</button>
        <button type="button" data-sec="trips">Mes voyages</button>
        <button type="button" data-sec="profile">Profil</button>
      </div>

      <!-- Fil d'actualité -->
      <section id="sec-feed">
        <div class="composer">
          <div class="row1">
            <span class="ava g2" id="comp-ava"></span>
            <textarea id="p-text" maxlength="1000" placeholder="Partage quelque chose de ton voyage..."></textarea>
          </div>
          <div class="row2">
            <input id="p-dest" type="text" maxlength="100" placeholder="📍 Destination (facultatif)">
            <button class="postbtn" id="btn-post" type="button">Publier</button>
          </div>
        </div>
        <div id="feed"></div>
      </section>

      <!-- Voyages -->
      <section id="sec-trips" class="hidden">
        <div class="panel">
          <h2 class="section-title">Nouveau voyage</h2>
          <label for="t-title">Titre</label>
          <input id="t-title" type="text">
          <label for="t-dest">Destination</label>
          <input id="t-dest" type="text">
          <div class="row">
            <div><label for="t-start">Départ</label><input id="t-start" type="date"></div>
            <div><label for="t-end">Retour</label><input id="t-end" type="date"></div>
          </div>
          <label for="t-budget">Budget</label>
          <input id="t-budget" type="number" min="0" value="0">
          <button class="btn" id="btn-add" type="button">Ajouter le voyage</button>
        </div>
        <h2 class="section-title">Mes voyages</h2>
        <div id="trips"></div>
      </section>

      <!-- Profil -->
      <section id="sec-profile" class="hidden">
        <div class="panel">
          <div class="p-head">
            <span class="ava g2" id="pf-ava"></span>
            <div><b id="pf-name"></b><div class="muted" id="pf-mail" style="margin:0;"></div></div>
          </div>
          <div id="pf-view"></div>
        </div>

        <div class="panel">
          <h2 class="section-title">Modifier mon profil</h2>
          <label for="pf-full-name">Nom complet</label>
          <input id="pf-full-name" type="text" maxlength="100">
          <label for="pf-bio">Biographie</label>
          <textarea id="pf-bio" maxlength="500"></textarea>
          <label for="pf-photo">Photo de profil (lien)</label>
          <input id="pf-photo" type="url" placeholder="https://...">
          <label for="pf-visited">Destinations visitées (séparées par des virgules)</label>
          <input id="pf-visited" type="text">
          <label for="pf-wished">Destinations souhaitées (séparées par des virgules)</label>
          <input id="pf-wished" type="text">
          <label for="pf-budget">Budget de voyage habituel</label>
          <input id="pf-budget" type="number" min="0" value="0">
          <label for="pf-styles">Styles de voyage (aventure, luxe, backpacking, culturel, détente, nature...)</label>
          <input id="pf-styles" type="text">
          <label for="pf-langs">Langues parlées</label>
          <input id="pf-langs" type="text">
          <label for="pf-acts">Activités préférées</label>
          <input id="pf-acts" type="text">
          <div class="row">
            <div><label for="pf-av-start">Disponible du</label><input id="pf-av-start" type="date"></div>
            <div><label for="pf-av-end">au</label><input id="pf-av-end" type="date"></div>
          </div>
          <button class="btn" id="btn-save-profile" type="button">Enregistrer mon profil</button>
        </div>
      </section>
    </main>

    <aside class="rsidebar">
      <div class="panel">
        <div class="rs-title">Ton prochain voyage</div>
        <div id="next-trip"></div>
      </div>
      <div class="panel">
        <div class="rs-title">Prochainement</div>
        <div class="soon-row"><span>Travel Mates</span><small>Matching IA</small></div>
        <div class="soon-row"><span>Tendances</span><small>Destinations</small></div>
        <div class="soon-row"><span>Communautés</span><small>Groupes</small></div>
      </div>
    </aside>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const TOKEN_KEY = "access";
  const GRADIENTS = ["g1", "g2", "g3", "g4", "g5"];
  let toastTimer = null;

  function toast(text, ok) {
    const t = $("toast");
    clearTimeout(toastTimer);
    if (!text) { t.className = "toast"; t.textContent = ""; return; }
    t.textContent = text;
    t.className = "toast show" + (ok ? " ok" : "");
    toastTimer = setTimeout(() => { t.className = "toast"; }, 5000);
  }

  function errorText(data) {
    if (!data) return "Une erreur est survenue.";
    if (data.error) return data.error;
    if (data.detail) return data.detail;
    const parts = [];
    for (const [field, value] of Object.entries(data)) {
      parts.push(field + " : " + (Array.isArray(value) ? value.join(" ") : value));
    }
    return parts.join(" | ") || "Une erreur est survenue.";
  }

  async function api(method, path, body) {
    const headers = { "Content-Type": "application/json" };
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch("/api" + path, {
      method, headers, body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    if (res.status !== 204) { try { data = await res.json(); } catch (e) {} }
    if (res.status === 401 && token && !path.startsWith("/auth/")) {
      logout("Session expirée (5 minutes), reconnecte-toi.");
    }
    return { ok: res.ok, status: res.status, data };
  }

  /* ---------- Utilitaires d'affichage ---------- */
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function gradientFor(key) {
    let h = 0;
    for (const ch of String(key)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return GRADIENTS[h % GRADIENTS.length];
  }

  function initial(name) {
    return (name || "?").trim().charAt(0).toUpperCase() || "?";
  }

  function avatar(name, key, size) {
    const a = el("span", "ava " + gradientFor(key), initial(name));
    a.style.width = size + "px";
    a.style.height = size + "px";
    return a;
  }

  function timeAgo(iso) {
    if (!iso) return "";
    const d = new Date(iso.endsWith("Z") || iso.includes("+") ? iso : iso + "Z");
    const min = Math.floor((Date.now() - d.getTime()) / 60000);
    if (min < 1) return "à l'instant";
    if (min < 60) return "il y a " + min + " min";
    const h = Math.floor(min / 60);
    if (h < 24) return "il y a " + h + " h";
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
  }

  function dayOnly(iso) { return (iso || "").slice(0, 10); }

  function fmtDay(iso) {
    return new Date(dayOnly(iso) + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
  }

  function emptyNote(box, text) { box.appendChild(el("div", "empty", text)); }

  /* ---------- Navigation ---------- */
  function showTab(name) {
    const isLogin = name === "login";
    $("form-login").classList.toggle("hidden", !isLogin);
    $("form-register").classList.toggle("hidden", isLogin);
    $("tab-login").classList.toggle("active", isLogin);
    $("tab-register").classList.toggle("active", !isLogin);
    toast("");
  }

  function showSection(name) {
    for (const sec of ["feed", "trips", "profile"]) {
      $("sec-" + sec).classList.toggle("hidden", sec !== name);
    }
    document.querySelectorAll("[data-sec]").forEach((b) => {
      b.classList.toggle("active", b.dataset.sec === name);
    });
    toast("");
    if (name === "feed") loadFeed();
    else if (name === "trips") loadTrips();
    else loadProfile();
  }

  function showApp(user) {
    $("auth").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("chip").textContent = user.full_name + " · " + user.email;
    $("side-name").textContent = user.full_name;
    $("side-mail").textContent = user.email;
    for (const [id, size] of [["side-ava", 60], ["comp-ava", 38]]) {
      const node = $(id);
      node.className = "ava " + gradientFor(user.id);
      node.textContent = initial(user.full_name);
      node.style.width = size + "px";
      node.style.height = size + "px";
    }
    toast("");
    showSection("feed");
    refreshTripInfo();
  }

  function logout(message) {
    localStorage.removeItem(TOKEN_KEY);
    $("app").classList.add("hidden");
    $("auth").classList.remove("hidden");
    showTab("login");
    if (message) toast(message);
  }

  function saveSession(data) {
    localStorage.setItem(TOKEN_KEY, data.tokens.access);
    showApp(data.user);
  }

  /* ---------- Fil d'actualité ---------- */
  async function loadFeed() {
    const { ok, data } = await api("GET", "/feed/");
    const box = $("feed");
    box.textContent = "";
    if (!ok) return;
    if (data.length === 0) { emptyNote(box, "Aucune publication pour l'instant. Sois la première à partager !"); return; }
    for (const p of data) {
      const post = el("article", "post");

      const head = el("div", "post-head");
      head.appendChild(avatar(p.author.full_name, p.author.id, 38));
      const who = el("div", "who");
      who.appendChild(el("b", "", p.author.full_name));
      const meta = [];
      if (p.destination) meta.push("📍 " + p.destination);
      meta.push(timeAgo(p.created_at));
      who.appendChild(el("div", "", meta.join(" · ")));
      head.appendChild(who);
      post.appendChild(head);

      const body = el("div", "post-body");
      body.appendChild(el("p", "", p.text));
      post.appendChild(body);

      const actions = el("div", "action-row");
      for (const label of ["❤ J'aime", "💬 Commenter", "📌 Enregistrer"]) {
        const s = el("span", "", label);
        s.title = "Bientôt disponible";
        actions.appendChild(s);
      }
      post.appendChild(actions);

      box.appendChild(post);
    }
  }

  /* ---------- Voyages ---------- */
  async function loadTrips() {
    const { ok, data } = await api("GET", "/trips/");
    const box = $("trips");
    box.textContent = "";
    if (!ok) return;
    if (data.length === 0) { emptyNote(box, "Aucun voyage pour l'instant."); return; }
    for (const t of data) {
      const row = el("div", "trip");
      const info = el("div");
      info.appendChild(el("b", "", t.title + " : " + t.destination));
      info.appendChild(el("small", "", dayOnly(t.start_date) + " → " + dayOnly(t.end_date) + " · budget " + t.budget));
      const del = el("button", "del", "Supprimer");
      del.type = "button";
      del.onclick = async () => {
        await api("DELETE", "/trips/" + t.id + "/");
        loadTrips();
        refreshTripInfo();
      };
      row.appendChild(info);
      row.appendChild(del);
      box.appendChild(row);
    }
  }

  async function refreshTripInfo() {
    const { ok, data } = await api("GET", "/trips/");
    if (!ok) return;
    const today = new Date();
    const todayStr = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");
    const upcoming = data
      .filter((t) => dayOnly(t.start_date) >= todayStr)
      .sort((a, b) => dayOnly(a.start_date).localeCompare(dayOnly(b.start_date)));

    $("stat-trips").textContent = data.length + (data.length > 1 ? " voyages" : " voyage");
    $("stat-upcoming").textContent = upcoming.length + (upcoming.length > 1 ? " voyages à venir" : " voyage à venir");

    const box = $("next-trip");
    box.textContent = "";
    if (upcoming.length === 0) {
      box.appendChild(el("p", "muted", "Aucun voyage à venir."));
      const b = el("button", "btn ghost", "Planifier un voyage");
      b.type = "button";
      b.style.marginTop = "0";
      b.onclick = () => showSection("trips");
      box.appendChild(b);
      return;
    }
    const t = upcoming[0];
    const days = Math.round((new Date(dayOnly(t.start_date) + "T00:00:00") - new Date(todayStr + "T00:00:00")) / 86400000);
    const card = el("div", "adv-card g3");
    card.appendChild(el("div", "eb", fmtDay(t.start_date) + " — " + fmtDay(t.end_date)));
    card.appendChild(el("h3", "", t.destination));
    card.appendChild(el("div", "rt", t.title + " · " + (days === 0 ? "c'est aujourd'hui" : "J-" + days)));
    box.appendChild(card);
    const b = el("button", "btn", "Voir mes voyages");
    b.type = "button";
    b.style.marginTop = "0";
    b.onclick = () => showSection("trips");
    box.appendChild(b);
  }

  /* ---------- Profil ---------- */
  function listFrom(id) {
    return $(id).value.split(",").map((x) => x.trim()).filter(Boolean);
  }

  function tagGroup(title, items) {
    const g = el("div", "p-group");
    g.appendChild(el("small", "", title));
    const row = el("div", "tags");
    if (items.length === 0) row.appendChild(el("span", "tag none", "Non renseigné"));
    for (const it of items) row.appendChild(el("span", "tag", it));
    g.appendChild(row);
    return g;
  }

  function renderProfile(p) {
    const ava = $("pf-ava");
    ava.className = "ava " + gradientFor(p.id);
    ava.style.backgroundImage = "";
    ava.textContent = initial(p.full_name);
    if (p.photo_url) {
      ava.style.backgroundImage = 'url("' + p.photo_url.replace(/"/g, "%22") + '")';
      ava.textContent = "";
    }
    $("pf-name").textContent = p.full_name;
    $("pf-mail").textContent = p.email || "";

    const view = $("pf-view");
    view.textContent = "";
    view.appendChild(el("p", "p-bio", p.bio || "Aucune biographie pour l'instant."));
    view.appendChild(tagGroup("Destinations visitées", p.visited_destinations));
    view.appendChild(tagGroup("Destinations souhaitées", p.wished_destinations));
    view.appendChild(tagGroup("Styles de voyage", p.travel_styles));
    view.appendChild(tagGroup("Langues", p.languages));
    view.appendChild(tagGroup("Activités préférées", p.favorite_activities));
    view.appendChild(tagGroup("Budget habituel", p.usual_budget ? [String(p.usual_budget)] : []));
    view.appendChild(tagGroup("Disponibilités", p.availability.map((a) => fmtDay(a.start_date) + " → " + fmtDay(a.end_date))));

    $("pf-full-name").value = p.full_name;
    $("pf-bio").value = p.bio;
    $("pf-photo").value = p.photo_url;
    $("pf-visited").value = p.visited_destinations.join(", ");
    $("pf-wished").value = p.wished_destinations.join(", ");
    $("pf-budget").value = p.usual_budget;
    $("pf-styles").value = p.travel_styles.join(", ");
    $("pf-langs").value = p.languages.join(", ");
    $("pf-acts").value = p.favorite_activities.join(", ");
    const first = p.availability[0];
    $("pf-av-start").value = first ? dayOnly(first.start_date) : "";
    $("pf-av-end").value = first ? dayOnly(first.end_date) : "";
  }

  async function loadProfile() {
    const { ok, status, data } = await api("GET", "/users/me/");
    if (ok) { renderProfile(data); return; }
    if (status === 404) toast("Le profil n'est pas encore activé côté serveur.");
    else if (data) toast(errorText(data));
  }

  async function saveProfile() {
    const body = {
      full_name: $("pf-full-name").value,
      bio: $("pf-bio").value,
      photo_url: $("pf-photo").value,
      visited_destinations: listFrom("pf-visited"),
      wished_destinations: listFrom("pf-wished"),
      usual_budget: Number($("pf-budget").value || 0),
      travel_styles: listFrom("pf-styles"),
      languages: listFrom("pf-langs"),
      favorite_activities: listFrom("pf-acts"),
    };
    const start = $("pf-av-start").value;
    const end = $("pf-av-end").value;
    if (start && end) body.availability = [{ start_date: start, end_date: end }];

    const { ok, data } = await api("PUT", "/users/me/", body);
    if (ok) {
      renderProfile(data);
      $("chip").textContent = data.full_name + " · " + data.email;
      $("side-name").textContent = data.full_name;
      toast("Profil enregistré", true);
    } else if (data) {
      toast(errorText(data));
    }
  }

  /* ---------- Événements ---------- */
  $("tab-login").onclick = () => showTab("login");
  $("tab-register").onclick = () => showTab("register");
  document.querySelectorAll("[data-sec]").forEach((b) => {
    b.onclick = () => showSection(b.dataset.sec);
  });

  $("btn-login").onclick = async () => {
    const { ok, data } = await api("POST", "/auth/login/", {
      email: $("login-email").value, password: $("login-password").value,
    });
    if (ok) saveSession(data); else toast(errorText(data));
  };

  $("btn-register").onclick = async () => {
    const { ok, data } = await api("POST", "/auth/register/", {
      full_name: $("reg-name").value, email: $("reg-email").value, password: $("reg-password").value,
    });
    if (ok) saveSession(data); else toast(errorText(data));
  };

  $("btn-post").onclick = async () => {
    const { ok, data } = await api("POST", "/posts/", {
      text: $("p-text").value, destination: $("p-dest").value,
    });
    if (ok) {
      toast("");
      $("p-text").value = ""; $("p-dest").value = "";
      loadFeed();
    } else if (data) {
      toast(errorText(data));
    }
  };

  $("btn-add").onclick = async () => {
    const { ok, data } = await api("POST", "/trips/", {
      title: $("t-title").value,
      destination: $("t-dest").value,
      start_date: $("t-start").value,
      end_date: $("t-end").value,
      budget: Number($("t-budget").value || 0),
    });
    if (ok) {
      toast("Voyage ajouté", true);
      $("t-title").value = ""; $("t-dest").value = "";
      loadTrips();
      refreshTripInfo();
    } else if (data) {
      toast(errorText(data));
    }
  };

  $("btn-save-profile").onclick = saveProfile;
  $("btn-logout").onclick = () => logout("");

  /* ---------- Démarrage : session existante ---------- */
  (async () => {
    if (!localStorage.getItem(TOKEN_KEY)) return;
    const { ok, data } = await api("GET", "/auth/me/");
    if (ok) showApp(data); else localStorage.removeItem(TOKEN_KEY);
  })();
</script>
</body>
</html>
